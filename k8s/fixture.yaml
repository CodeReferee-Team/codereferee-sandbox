
apiVersion: v1
kind: Namespace
metadata:
  name: codereferee-sandbox
  labels:
    app.kubernetes.io/part-of: codereferee
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-api
  namespace: codereferee-sandbox
  labels:
    app.kubernetes.io/name: fixture-api
    app.kubernetes.io/part-of: codereferee
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture-api
        app.kubernetes.io/part-of: codereferee
    spec:
      containers:
        - name: fixture-api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=CodeReferee fixture healthy"
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-api
  namespace: codereferee-sandbox
  labels:
    app.kubernetes.io/name: fixture-api
    app.kubernetes.io/part-of: codereferee
spec:
  selector:
    app.kubernetes.io/name: fixture-api
  ports:
    - name: http
      port: 5678
      targetPort: http
